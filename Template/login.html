{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{%static 'CSS/login.css'%}">
    <link rel="stylesheet" href="{%static 'CSS/nav.css'%}">

</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <!--Generated dynamically by js-->
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="login-container">
            <h1 class="login-title">Login to Your Account</h1>
            {% if msg_bool%}
            <p style="align-self: center; color: rgb(167, 16, 16); align-items: center;justify-self: center;">{{error}}</p>
            {% endif %}
            
            <form id="loginForm" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <input 
                        type="email" 
                        name="email"
                        class="form-input" 
                        placeholder="Enter your email" 
                        required
                        id="email"
                    >
                </div>
                
                <div class="form-group">
                    <div class="password-container">
                        <input 
                            type="password" 
                            name="password"
                            class="form-input" 
                            placeholder="Enter your password" 
                            required
                            id="password"
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <div class="forgot-password">
                        <a href="#">Forgot Password?</a>
                    </div>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
            </form>
            
            <div class="divider">
                <span>or continue with</span>
            </div>
            
            <button class="google-btn" onclick="loginWithGoogle()">
                <div class="google-icon"></div>
                Login with Google
            </button>
            
            <div class="register-link">
                Don't have an account? <a href="{%url 'signup'%}">Register here</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <!--Generated dynamically by js-->
    </footer>
    {% if user.is_authenticated %}
    <script>
        const home = `<a href="{%url 'home'%}" class="logo">Campus Connect</a>`
        const user_name = '{{ user.first_name|upper|slice:":1" }}' + '{{ user.last_name|upper|slice:":1" }}'
        const search = `
            <input type="text" class="search-bar" id="search-bar" placeholder="Search...">
            <button class="search-btn" onClick="Search()">🔍</button>
            `
        const nav_urls = `
                    <li><a href="{%url 'question_library'%}">Ask Questions</a></li>
                    <li><a href="market.html">Sell Books</a></li>
                    <li><a href="notes.html">Notes</a></li>
                    <li><a href="group.html">Groups</a></li>
                    `
        const login= `
            <div class="user-dropdown">
                <div class="user-avatar">${user_name}</div>
                <div class="dropdown-menu">
                    <a href="{%url 'user' %}"><i class="fas fa-user"></i> Profile</a>
                    <a href="{%url 'logout'%}"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        `
        const footer_urls = `
                    <a href="#">About Us</a>
                    <a href="#">Contact</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Service</a>
                    <a href="#">Help Center</a>`
        const footer_urls_2 = `
                    <a href="{%url 'question_library'%}">Ask Questions</a>
                    <a href="market.html">Sell Books</a>
                    <a href="notes.html">Share Notes</a>
                    <a href="group.html">Create Groups</a>
                    <a href="{%url 'home'%}">Campus Events</a>`
    </script>
    {% else %}
    <script>
        const home = `<a href="{%url 'home'%}" class="logo">Campus Connect</a>`
        const search = `
            <input type="text" class="search-bar" id="search-bar" placeholder="Search...">
            <button class="search-btn" onClick="Search()">🔍</button>
            `
        const nav_urls = `
                    <li><a href="{%url 'question_library'%}">Ask Questions</a></li>
                    <li><a href="market.html">Sell Books</a></li>
                    <li><a href="notes.html">Notes</a></li>
                    <li><a href="group.html">Groups</a></li>
                    `

        const login = `
                <a href="{%url 'signup'%}" class="btn-primary">Sign Up</a>
            `

        const footer_urls = `
                    <a href="#">About Us</a>
                    <a href="#">Contact</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Service</a>
                    <a href="#">Help Center</a>`
        const footer_urls_2 = `
                    <a href="{%url 'question_library'%}">Ask Questions</a>
                    <a href="market.html">Sell Books</a>
                    <a href="notes.html">Share Notes</a>
                    <a href="group.html">Create Groups</a>
                    <a href="{%url 'home'%}">Campus Events</a>`
    </script>
    {% endif %}
    <script src="{%static 'JS/index.js'%}"></script>
    <script>
        function Search(){
            const search_link = "{%url 'search'%}"
            let search_data = document.getElementById('search-bar')
            window.location.href = search_link + `?result=${search_data.value}`
        }
    </script>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        }

        // Handle Google login
        function loginWithGoogle() {
            window.location.href = "{% url 'social:begin' 'google-oauth2' %}?next={{ request.path }}"
        }

        // Mobile menu toggle (basic implementation)
        document.querySelector('.mobile-menu-btn').addEventListener('click', function() {
            // This would toggle a mobile menu dropdown
            console.log('Mobile menu clicked');
        });

        // Add form validation styling
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('blur', function() {
                if (this.value.trim() === '') {
                    this.style.borderColor = '#e74c3c';
                } else {
                    this.style.borderColor = '#27ae60';
                }
            });
            
            input.addEventListener('focus', function() {
                this.style.borderColor = '#1E90FF';
            });
        });
    </script>
</body>
</html>
