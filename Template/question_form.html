{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask a Question - Campus Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{%static 'CSS/question_form.css'%}">
    <link rel="stylesheet" href="{%static 'CSS/nav.css'%}">
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <!--Generated dynamically by js-->
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Ask a Question</h1>
            <p class="page-subtitle">Get help from your campus community</p>
        </div>

        <div class="question-form-container">
            <form id="questionForm" method="post">
                {% csrf_token %}
                <!-- Question Title -->
                <div class="form-group">
                    <label for="questionTitle" class="form-label">Question Title *</label>
                    <input 
                        type="text" 
                        id="questionTitle"
                        class="form-input" 
                        placeholder="Enter your question title" 
                        required
                    >
                </div>

                <!-- Question Description -->
                <div class="form-group">
                    <label for="questionDescription" class="form-label">Question Description *</label>
                    <div id="questionDescription" contenteditable="true" style="border:1px solid #ccc; padding:10px; min-height:150px; max-width: 100%; overflow-x: auto; border-radius: 10px;"></div>
                </div>

                <div class="form-group image-upload">
                    <label>Add Image or drag and drop on text editor(Optional)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="imageInput" accept="image/*" style="display:none;">
                        <button class="file-input-label" id="file-input-label">
                            📎 Choose File
                        </button>
                        
                    </div>
                </div>

                <!-- Course Selection -->
                <div class="form-group">
                    <label class="form-label">Related Courses</label>
                    <div class="course-selection">
                        <div class="course-dropdown-container">
                            <select id="courseSelect" class="form-select">
                                <option value="">Select a course...</option>
                                {% for course in courses%}
                                <option value="{{course.course_name}}">{{course.course_name}}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="button" id="addCourseBtn" class="add-course-btn">
                            <i class="fas fa-plus"></i> Add Course
                        </button>
                    </div>

                    <!-- Selected Courses Display -->
                    <div class="selected-courses">
                        <div id="coursesGrid" class="courses-grid">
                            <!-- Selected course chips will be dynamically added here -->
                        </div>
                        <div id="emptyCoursesMessage" class="empty-courses-message">
                            No courses selected yet. Choose courses related to your question.
                        </div>
                    </div>
                </div>

                <!-- Hidden input to store selected courses JSON -->
                <input type="hidden" id="selectedCoursesInput" name="selectedCourses">

                <!-- Submit Button -->
                <button type="submit" class="submit-btn" id="submit-btn">
                    <i class="fas fa-paper-plane"></i> Post Question
                </button>
            </form>

            <!-- Debug Panel (for development) -->
            <div class="debug-panel" id="debugPanel" hidden>
                <div class="debug-title">Selected Courses Array (Debug):</div>
                <div class="debug-content" id="debugContent">[]</div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <!--Generated dynamically by js-->
    </footer>

    <script>
        const home = `<a href="{%url 'home'%}" class="logo">Campus Connect</a>`
        {% if user.image != None %}
        const user_name = '<img class="user-avatar" src="{{user.image.file.url}}" alt="Avatar">'
        {% else %}
        const user_name = '<div class="user-avatar">{{ user.first_name|upper|slice:":1" }}' + '{{ user.last_name|upper|slice:":1" }}</div>'
        {% endif %}
        const search = `
            <input type="text" class="search-bar" id="search-bar" placeholder="Search...">
            <button class="search-btn" onClick="Search()">🔍</button>
            `
        const nav_urls = `
                    <li><a href="{%url 'question_library'%}">Ask Questions</a></li>
                    <li><a href="{%url 'market'%}">Market</a></li>
                    <li><a href="{%url 'notes'%}">Notes</a></li>
                    <li><a href="group.html">Groups</a></li>
                    `
        const login= `
            {% if user.is_verified %}
                <div class="user-dropdown">
                    <div class="quick-post-btn">Post +</div>
                    <div class="dropdown-menu">
                        <a href="{%url 'note_upload'%}"><i class="fas"></i> Upload Notes</a>
                    </div>
                </div>     
            {% endif %}
            <div class="user-dropdown">
                <div class="user-avatar">${user_name}</div>
                <div class="dropdown-menu">
                    <a href="{%url 'user' %}"><i class="fas fa-user"></i> Profile</a>
                    <a href="{%url 'logout'%}"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        `
        const footer_urls = `
                    <a href="#">About Us</a>
                    <a href="#">Contact</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Service</a>
                    <a href="#">Help Center</a>`
        const footer_urls_2 = `
                    <a href="{%url 'question_library'%}">Ask Questions</a>
                    <a href="{%url 'market'%}">Market</a>
                    <a href="{%url 'notes'%}">Share Notes</a>
                    <a href="group.html">Create Groups</a>
                    <a href="{%url 'home'%}">Campus Events</a>`
    </script>
    <script src="{%static 'JS/index.js'%}"></script>
    <script>
        function Search(){
            const search_link = "{%url 'search'%}"
            let search_data = document.getElementById('search-bar')
            window.location.href = search_link + `?result=${search_data.value}`
        }
    </script>

    <script>
    let uploadedFiles = [];   // store real File objects for submission
    let savedSelection;

    const editor = document.getElementById("questionDescription");
    const fileInput = document.getElementById("imageInput");
    const uploadBtn = document.getElementById("file-input-label");
    const submitBtn = document.getElementById("submitBtn");

    // Track caret position inside editor
    editor.addEventListener("keyup", saveSelection);
    editor.addEventListener("mouseup", saveSelection);

    function saveSelection() {
    const selection = window.getSelection();
    if (selection.rangeCount > 0) {
        savedSelection = selection.getRangeAt(0);
    }
    }


    editor.addEventListener("drop", function(e) {
        e.preventDefault();
        for (const item of e.dataTransfer.items) {
            if (item.kind === "file") {
            // Dropped file (image)
            const file = item.getAsFile();
            if (file && file.type.startsWith("image/")) {
                uploadedFiles.push(file); // save original File object

                // show preview in editor
                const reader = new FileReader();
                reader.onload = function(evt) {
                const img = document.createElement("img");
                img.src = evt.target.result;
                img.style.width = '400px';
                img.style.height = '400px'
                editor.appendChild(img);
                };
                reader.readAsDataURL(file);
            }
            }
        }
        });

        // Handle paste (force clean text/code with white background + black text)
        editor.addEventListener("paste", function(e) {
        e.preventDefault();

        const text = (e.clipboardData || window.clipboardData).getData("text/plain");

        // Detect if it's code (multi-line or contains { } ;)
        if (text.includes("\n") || text.includes("{") || text.includes(";")) {
            const pre = document.createElement("pre");
            const code = document.createElement("code");
            code.textContent = text;
            pre.appendChild(code);

            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            range.deleteContents();
            range.insertNode(pre);
            const brDiv = document.createElement("div");
            brDiv.innerHTML = "<br>";
            pre.parentNode.insertBefore(brDiv, pre.nextSibling);

            // ✅ Move caret into the new blank line
            range.setStart(brDiv, 0);
            range.setEnd(brDiv, 0);
            sel.removeAllRanges();
            sel.addRange(range);
        } else {
            // Otherwise insert plain black text
            document.execCommand("insertText", false, text);
        }

        });
    // Open hidden file input when clicking upload
    uploadBtn.addEventListener("click", () => fileInput.click());


    // Handle chosen file
    fileInput.addEventListener("change", function() {
    const file = this.files[0];
    if (file) {
        uploadedFiles.push(file); // store real file

        const reader = new FileReader();
        reader.onload = function(evt) {
        const img = document.createElement("img");
        img.src = evt.target.result;  // preview image
        img.style.width = "400px";
        img.style.height = "400px";

        insertAtCursor(img);
        };
        reader.readAsDataURL(file);
    }
    this.value = ""; // reset so same file can be uploaded again // reset so same file can be uploaded again// reset so same file can be uploaded again
    });

    // Insert image (or any node) at saved cursor position
    function insertAtCursor(node) {
    if (savedSelection) {
        const range = savedSelection;
        range.deleteContents();
        range.insertNode(node);

        // Move cursor after the inserted image
        range.setStartAfter(node);
        range.setEndAfter(node);

        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
    } else {
        editor.appendChild(node);
    }
    }
    </script>

    <script>
        // Global array to store selected courses
        let selectedCourses = [];

        // DOM elements
        const courseSelect = document.getElementById('courseSelect');
        const addCourseBtn = document.getElementById('addCourseBtn');
        const coursesGrid = document.getElementById('coursesGrid');
        const emptyMessage = document.getElementById('emptyCoursesMessage');
        const debugContent = document.getElementById('debugContent');
        const hiddenInput = document.getElementById('selectedCoursesInput');
        const questionForm = document.getElementById('questionForm');

        // Update UI and debug display
        function updateDisplay() {
            // Update hidden input with JSON
            hiddenInput.value = JSON.stringify(selectedCourses);
            
            // Update debug panel
            debugContent.textContent = JSON.stringify(selectedCourses, null, 2);
            
            // Show/hide empty message
            if (selectedCourses.length === 0) {
                emptyMessage.style.display = 'block';
                coursesGrid.style.display = 'none';
            } else {
                emptyMessage.style.display = 'none';
                coursesGrid.style.display = 'flex';
            }

            // Update add button state
            const selectedValue = courseSelect.value;
            addCourseBtn.disabled = !selectedValue || selectedCourses.includes(selectedValue);
            
            
        }

        // Add course chip to the UI
        function createCourseChip(courseName) {
            const chip = document.createElement('div');
            chip.className = 'course-chip';
            chip.dataset.course = courseName;
            
            chip.innerHTML = `
                <span>${courseName}</span>
                <button type="button" class="chip-remove-btn" onclick="removeCourse('${courseName}')">
                    <i class="fas fa-times"></i>
                </button>
            `;
            
            return chip;
        }

        // Add course function
        function addCourse() {
            const selectedValue = courseSelect.value.trim();
            
            if (!selectedValue) {
                alert('Please select a course first.');
                return;
            }
            
            if (selectedCourses.includes(selectedValue)) {
                alert('This course is already selected.');
                return;
            }
            
            // Add to array
            selectedCourses.push(selectedValue);
            
            // Create and add chip to UI
            const chip = createCourseChip(selectedValue);
            coursesGrid.appendChild(chip);
            
            // Reset dropdown
            courseSelect.value = '';
            
            // Update display
            updateDisplay();
        }

        // Remove course function
        function removeCourse(courseName) {
            // Find and remove chip from DOM with animation
            const chip = document.querySelector(`[data-course="${courseName}"]`);
            if (chip) {
                chip.classList.add('removing');
                setTimeout(() => {
                    chip.remove();
                    updateDisplay();
                }, 300);
            }
            
            // Remove from array
            selectedCourses = selectedCourses.filter(course => course !== courseName);
        }

        // Event listeners
        addCourseBtn.addEventListener('click', addCourse);

        courseSelect.addEventListener('change', function() {
            updateDisplay();
        });

        // Allow adding course with Enter key when dropdown is focused
        courseSelect.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addCourse();
            }
        });

        // Form submission
        function getCookie(name){
            let cookieValue = null;
            if(document.cookie && document.cookie !== ''){
                const cookies = document.cookie.split(';');
                for(let i=0;i <cookies.length; i++){
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === name + '='){
                        cookieValue = decodeURIComponent(cookie.substring(name.length+1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function FormSubmission(formData, submitButton){

            fetch('{%url "question"%}', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body:formData
            })
            .then(response => response.json())
            .then(data => {
                if(data.status){
                    submitButton.style.color = 'green'
                    submitButton.textContent = "Successful"
                    setTimeout(() => {
                        window.location.href = data.url;
                    }, 1500);
                } else {
                    submitButton.style.color = 'red'
                    submitButton.textContent = "Failed! Try Again"
                }
            })
        }



        questionForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData();
            formData.append('question', document.getElementById('questionTitle').value)
            formData.append('courses', selectedCourses)

            uploadedFiles.forEach((file, i) => {
                formData.append(`image${i}`, file);
            });


            let f = () => {
                // Remove scripts and functions and add to formData
                let temp = document.createElement('div')
                temp.innerHTML = editor.innerHTML;
                let els =temp.querySelectorAll('*')
                els.forEach(el => {
                    if (el.tagName == 'script'){
                        el.remove()
                    }
                    else{
                        [...el.attributes].forEach(attr =>{
                            if (attr.name.startsWith('on')){
                                el.romoveAttribute(attr.name);
                            }
                        })
                    }
                })
                let imgs = temp.querySelectorAll('img');
                imgs.forEach(imgsrc => {
                    imgsrc.src = '';
                });
                formData.append('description', temp.innerHTML);
            };

            f()

            const submitButton = document.getElementById('submit-btn')
            submitButton.style.color = 'white'
            submitButton.textContent = "Processing Request"
            
            FormSubmission(formData, submitButton)
            
        });

        

        // Form validation
        document.querySelectorAll('.form-input, .form-textarea').forEach(input => {
            input.addEventListener('blur', function() {
                if (this.hasAttribute('required') && this.value.trim() === '') {
                    this.style.borderColor = '#e74c3c';
                } else {
                    this.style.borderColor = '#27ae60';
                }
            });
            
            input.addEventListener('focus', function() {
                this.style.borderColor = '#1E90FF';
            });
        });

        // Initialize display
        updateDisplay();

        // Mobile menu toggle
        document.querySelector('.mobile-menu-btn').addEventListener('click', function() {
        });
    </script>
</body>
</html>
