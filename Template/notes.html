    <script>
        // Sample notes data
        const notesData = [
            {
                id: 1,
                title: "Introduction to Data Structures",
                description: "Comprehensive notes covering arrays, linked lists, stacks, queues, and their implementations with examples.",
                course: "Computer Science",
                uploader: "John Doe",
                date: "2024-10-20",
                downloads: 245,
                views: 1250,
                rating: 4.8
            },
            
        ];

        // State variables
        let currentPage = 1;
        const notesPerPage = 6;
        let filteredNotes = [...notesData];

        // Get DOM elements
        const notesGrid = document.getElementById('notesGrid');
        const pagination = document.getElementById('pagination');
        const sortBy = document.getElementById('sortBy');
        const courseFilter = document.getElementById('courseFilter');
        const loading = document.getElementById('loading');
        const noResults = document.getElementById('noResults');

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays} days ago`;
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // Create note card
        function createNoteCard(note) {
            return `
                <div class="note-card" onclick="openNoteDetails(${note.id})">
                    <div class="note-icon">📄</div>
                    <h3 class="note-title">${note.title}</h3>
                    <p class="note-description">${note.description}</p>
                    <div class="course-tags">
                        <span class="tag">${note.course}</span>
                    </div>
                    <div class="uploader-info">
                        Uploaded by <strong>${note.uploader}</strong> • ${formatDate(note.date)}
                    </div>
                    <div class="stats-row">
                        <div class="stat-item">⬇ ${note.downloads}</div>
                        <div class="stat-item">👁 ${note.views}</div>
                        <div class="stat-item">⭐ ${note.rating}</div>
                    </div>
                </div>
            `;
        }

        // Render notes
        function renderNotes() {
            const startIndex = (currentPage - 1) * notesPerPage;
            const endIndex = startIndex + notesPerPage;
            const notesToShow = filteredNotes.slice(startIndex, endIndex);

            if (filteredNotes.length === 0) {
                notesGrid.style.display = 'none';
                noResults.style.display = 'block';
                pagination.style.display = 'none';
            } else {
                notesGrid.style.display = 'grid';
                noResults.style.display = 'none';
                pagination.style.display = 'flex';
                notesGrid.innerHTML = notesToShow.map(createNoteCard).join('');
            }

            renderPagination();
        }

        // Render pagination
        function renderPagination() {
            const totalPages = Math.ceil(filteredNotes.length / notesPerPage);
            let paginationHTML = '';

            // Previous button
            paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹ Prev</button>`;

            // Page numbers
            for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                paginationHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            // More button
            if (totalPages > 5) {
                paginationHTML += `<button class="page-btn">More...</button>`;
            }

            // Next button
            paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next ›</button>`;

            pagination.innerHTML = paginationHTML;
        }

        // Change page
        function changePage(page) {
            const totalPages = Math.ceil(filteredNotes.length / notesPerPage);
            if (page < 1 || page > totalPages) return;
            
            currentPage = page;
            showLoading();
            setTimeout(() => {
                hideLoading();
                renderNotes();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 300);
        }

        // Show loading
        function showLoading() {
            loading.style.display = 'block';
            notesGrid.style.display = 'none';
        }

        // Hide loading
        function hideLoading() {
            loading.style.display = 'none';
        }

        // Apply filters and sorting
        function applyFiltersAndSort() {
            let result = [...notesData];

            // Apply course filter
            const selectedCourse = courseFilter.value;
            if (selectedCourse !== 'all') {
                result = result.filter(note => note.course === selectedCourse);
            }

            // Apply sorting
            const sortOption = sortBy.value;
            switch (sortOption) {
                case 'latest':
                    result.sort((a, b) => new Date(b.date) - new Date(a.date));
                    break;
                case 'downloads':
                    result.sort((a, b) => b.downloads - a.downloads);
                    break;
                case 'course':
                    result.sort((a, b) => a.course.localeCompare(b.course));
                    break;
            }

            filteredNotes = result;
            currentPage = 1;
            renderNotes();
        }

        // Event listeners
        sortBy.addEventListener('change', () => {
            showLoading();
            setTimeout(() => {
                hideLoading();
                applyFiltersAndSort();
            }, 300);
        });

        courseFilter.addEventListener('change', () => {
            showLoading();
            setTimeout(() => {
                hideLoading();
                applyFiltersAndSort();
            }, 300);
        });

        // Open note details
        function openNoteDetails(noteId) {
            alert(`Opening details for note ID: ${noteId}\n\nThis would redirect to a Note Details Page in the full application.`);
        }

        // Initialize
        renderNotes();
    </script>
