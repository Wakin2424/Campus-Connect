<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Editor with File Upload</title>
  <style>
    #editor {
      border: 1px solid #ccc;
      padding: 10px;
      min-height: 200px;
      width: 600px;
      white-space: pre-wrap;
      font-family: Arial, sans-serif;
      color: black;
    }
    #editor img {
      width: 400px;
      height: 400px;
      object-fit: contain;
      display: block;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h2>Custom Editor</h2>
  <div id="editor" contenteditable="true">
    Drag & drop text or an image here...
  </div>

  <button id="submitBtn">Submit</button>
  <div id="result"></div>
  <script>
    const resultdiv = document.getElementById('result')
    function DataPrint(data){
        resultdiv.innerHTML = data
    }

    function getCookie(name){
        let cookieValue = null;
        if(document.cookie && document.cookie !== ''){
            const cookies = document.cookie.split(';');
            for(let i=0;i <cookies.length; i++){
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === name + '='){
                    cookieValue = decodeURIComponent(cookie.substring(name.length+1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function FormSubmission(dataset, images){
        fetch('{%url "test"%}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body:JSON.stringify(
                {
                  'dataset':dataset, 
                  'images':images
                }
            )
        })
        .then(response => response.json())
        .then(data => {
            DataPrint(data.data)
        })
    }
    
  </script>


  <script>
    const editor = document.getElementById("editor");
    const uploadedFiles = []; 

    // Handle drag-drop
    editor.addEventListener("drop", function(e) {
      e.preventDefault();

      for (const item of e.dataTransfer.items) {
        if (item.kind === "string") {
          // Dropped text
          item.getAsString(text => {
            document.execCommand("insertText", false, text);
          });
        } else if (item.kind === "file") {
          // Dropped file (image)
          const file = item.getAsFile();
          if (file && file.type.startsWith("image/")) {
            uploadedFiles.push(file); // save original File object

            // show preview in editor
            const reader = new FileReader();
            reader.onload = function(evt) {
              const img = document.createElement("img");
              img.src = evt.target.result;
              editor.appendChild(img);
            };
            reader.readAsDataURL(file);
          }
        }
      }
    });

    // Handle submit (send FormData like input[type=file])
    document.getElementById("submitBtn").addEventListener("click", async () => {
      let dataset = editor.innerHTML
      FormSubmission(dataset, uploadedFiles)
    });
  </script>
</body>
</html>
