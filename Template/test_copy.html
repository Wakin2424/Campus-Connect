<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
.batch {
  display: none;
  margin-top: 10px;
}
.batch.active {
  display: block;
}
.page-btn.active {
  background: #007bff;
  color: white;
}

  </style>
</head>
<body>
  <div id="batchContainer"></div>

<div id="pagination">
  <button id="page1" class="page-btn active">1</button>
  <button id="loadMore">Load More</button>
</div>

  <script>
const batchContainer = document.getElementById("batchContainer");
const pagination = document.getElementById("pagination");
const loadMoreBtn = document.getElementById("loadMore");

let currentPage = 1;
let totalPages = 1;

// Create and display the first batch
createBatch(1);
showBatch(1);

loadMoreBtn.addEventListener("click", () => {
  totalPages++;
  createBatch(totalPages);
  createPageButton(totalPages);
  showBatch(totalPages);
});

// Create a batch of data as divs
function createBatch(page) {
  const batch = document.createElement("div");
  batch.className = "batch";
  batch.id = `batch${page}`;

  // Example data: 5 items per batch
  for (let i = 1; i <= 5; i++) {
    const item = document.createElement("div");
    item.textContent = `Batch ${page} - Item ${i}`;
    batch.appendChild(item);
  }

  batchContainer.appendChild(batch);
}

// Create page navigation buttons (1, 2, 3...)
function createPageButton(page) {
  const btn = document.createElement("button");
  btn.className = "page-btn";
  btn.textContent = page;

  btn.addEventListener("click", () => {
    showBatch(page);
  });

  pagination.insertBefore(btn, loadMoreBtn);
}

// Show specific batch and hide others
function showBatch(page) {
  document.querySelectorAll(".batch").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".page-btn").forEach(b => b.classList.remove("active"));

  document.getElementById(`batch${page}`).classList.add("active");
  document.querySelector(`.page-btn:nth-of-type(${page})`).classList.add("active");

  currentPage = page;
}

  </script>
</body>
</html>
