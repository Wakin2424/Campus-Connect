<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Contenteditable Editor</title>
  <style>
    #editor {
      border: 1px solid #ccc;
      padding: 10px;
      min-height: 200px;
      width: 600px;
      white-space: pre-wrap;
      font-family: Arial, sans-serif;
      color: black; /* all text black */
    }

    /* force images inside editor to be default 400x400 */
    #editor img {
      width: 400px;
      height: 400px;
      object-fit: contain;
    }

    /* style pasted code */
    #editor pre, #editor code {
      background: white !important;
      color: black !important;
      font-family: Consolas, "Courier New", monospace;
      padding: 10px;
      display: block;
      border: 1px solid #ddd;
      border-radius: 4px;
      white-space: pre;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h2>Custom Editor</h2>
  <div id="editor" contenteditable="true">
    Type here, paste code, or drag & drop an image...
  </div>
  <button onClick="buttonClick()">Click me</button>
  <div id='result'></div>
  <script>
    const resultdiv = document.getElementById('result')
    function DataPrint(data){
        resultdiv.innerHTML = data
    }

    function getCookie(name){
        let cookieValue = null;
        if(document.cookie && document.cookie !== ''){
            const cookies = document.cookie.split(';');
            for(let i=0;i <cookies.length; i++){
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === name + '='){
                    cookieValue = decodeURIComponent(cookie.substring(name.length+1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function FormSubmission(dataset, imageset){
        fetch('{%url "test"%}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body:JSON.stringify(
                {'data':dataset,
                'images':imageset}
            )
        })
        .then(response => response.json())
        .then(data => {
            DataPrint(data.data)
        })
    }
    
  </script>

  <script>
    const editor = document.getElementById("editor");
    const images = []
    


    // Handle drag & drop images
    editor.addEventListener("drop", function(e) {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const img = document.createElement("img");
          img.src = evt.target.result;
          editor.appendChild(img);
        };
        reader.readAsDataURL(file);
      }
    });

    // Handle paste (force clean text/code with white background + black text)
    editor.addEventListener("paste", function(e) {
      e.preventDefault();

      const text = (e.clipboardData || window.clipboardData).getData("text/plain");

      // Detect if it's code (multi-line or contains { } ;)
      if (text.includes("\n") || text.includes("{") || text.includes(";")) {
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        code.textContent = text;
        pre.appendChild(code);

        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(pre);
      } else {
        // Otherwise insert plain black text
        document.execCommand("insertText", false, text);
      }

    });

    function buttonClick(){
        let data = editor.innerHTML
        FormSubmission(data, images)
    }

  </script>
</body>
</html>
