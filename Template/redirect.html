{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Payment - Campus Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{%static 'CSS/redirect.css'%}">
</head>
<body>
    <div class="container">
        <div class="content-card">
            <div class="logo">Campus Connect</div>
            <div class="logo-subtitle">Payment Processing</div>

            <div class="spinner-container">
                <div class="pulse-ring"></div>
                <div class="spinner"></div>
            </div>

            <h1 id="heading">Processing Payment...</h1>
            <p class="message" id="message">Please wait while we process your payment.</p>
            <div class="status-badge" id="status">Initializing</div>

        </div>
    </div>
</body>
</html>
