<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/group-landing-page.css">
    <link rel="stylesheet" href="css/nav.css">
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <!--Generated dynamically by js-->
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-container">
            <div class="hero-content">
                <h1>Join Groups. Learn Together. Grow Faster.</h1>
                <p>Connect with students who share your interests, collaborate on projects, and build lasting friendships in communities that matter to you.</p>
                <button class="cta-button" onclick="exploreGroups()">Explore Groups</button>
            </div>
            <div class="hero-animation">
                <div class="connection-node node-1">👤</div>
                <div class="connection-node node-2">👥</div>
                <div class="connection-node node-3">🎓</div>
                <div class="connection-node node-4">💡</div>
                <div class="connection-node node-5">🤝</div>
                
                <div class="connection-line line-1"></div>
                <div class="connection-line line-2"></div>
                <div class="connection-line line-3"></div>
                
                <div class="chat-bubble bubble-1">💬 Let's collaborate!</div>
                <div class="chat-bubble bubble-2">✨ Great idea!</div>
            </div>
        </div>
    </section>

    <!-- Popular Groups Section -->
    <section id="popular-groups">
        <h2 class="section-title">Popular Groups</h2>
        <div class="groups-grid" id="groups-container">
            <!-- Group cards will be generated by JavaScript -->
        </div>
    </section>

    <!-- Popular Categories Section -->
    <div class="categories-section">
        <div class="categories-container">
            <h2 class="section-title">Explore by Category</h2>
            <div class="categories-grid" id="categories-container">
                <!-- Category cards will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <!--Generated dynamically by js-->
    </footer>

    <script>
        const home = `<a href="#" class="logo">Campus Connect</a>`
        const search = `
            <a href=''><button class="search-btn">🔍</button></a>
            `
        const nav_urls = `
                    <li><a href="qa.html">Ask Questions</a></li>
                    <li><a href="market.html">Sell Books</a></li>
                    <li><a href="notes.html">Notes</a></li>
                    <li><a href="group.html">Groups</a></li>
                    `
        const login = `
                <a href="login.html" class="btn-primary">Login/Sign Up</a>
            `

        const footer_urls = `
                    <a href="#">About Us</a>
                    <a href="#">Contact</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Service</a>
                    <a href="#">Help Center</a>`
        const footer_urls_2 = `
                    <a href="qa.html">Ask Questions</a>
                    <a href="market.html">Sell Books</a>
                    <a href="notes.html">Share Notes</a>
                    <a href="group.html">Create Groups</a>
                    <a href="home">Campus Events</a>`
    </script>
    <script src="css/index.js"></script>

    <script>
        // Sample data for popular groups
        const popularGroups = [
            { id: 1, title: 'Web Development Enthusiasts', creator: 'Sarah Johnson', members: 1250, icon: '💻' },
            { id: 2, title: 'Data Science & AI Community', creator: 'Michael Chen', members: 980, icon: '📊' },
            { id: 3, title: 'Business Strategy Forum', creator: 'Emily Davis', members: 750, icon: '💼' },
            { id: 4, title: 'Machine Learning Hub', creator: 'David Williams', members: 1100, icon: '🤖' },
            { id: 5, title: 'Creative Writing Circle', creator: 'Jessica Brown', members: 620, icon: '✍️' },
            { id: 6, title: 'Engineering Solutions Lab', creator: 'James Wilson', members: 890, icon: '⚙️' },
            { id: 7, title: 'Digital Marketing Pros', creator: 'Amanda Lee', members: 540, icon: '📱' },
            { id: 8, title: 'Physics & Astronomy', creator: 'Robert Taylor', members: 430, icon: '🔭' }
        ];

        // Sample data for categories
        const categories = [
            { id: 1, name: 'Programming', icon: '💻' },
            { id: 2, name: 'Engineering', icon: '⚙️' },
            { id: 3, name: 'Business', icon: '💼' },
            { id: 4, name: 'Science', icon: '🔬' },
            { id: 5, name: 'Arts', icon: '🎨' },
            { id: 6, name: 'Study Groups', icon: '📚' }
        ];

        // Mobile menu toggle
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');

        mobileMenu.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // Close mobile menu when clicking a link
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
            });
        });

        // Generate group cards
        function generateGroupCards() {
            const container = document.getElementById('groups-container');
            popularGroups.forEach(group => {
                const card = document.createElement('a');
                card.className = 'group-card';
                card.href = '#';
                card.onclick = (e) => {
                    e.preventDefault();
                    viewGroupDetail(group.id);
                };
                
                card.innerHTML = `
                    <div class="group-card-banner">${group.icon}</div>
                    <div class="group-info">
                        <div class="group-title">${group.title}</div>
                        <div class="group-creator">Created by ${group.creator}</div>
                        <div class="group-members">${group.members.toLocaleString()} members</div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // Generate category cards
        function generateCategoryCards() {
            const container = document.getElementById('categories-container');
            categories.forEach(category => {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.onclick = () => filterByCategory(category.name);
                
                card.innerHTML = `
                    <div class="category-icon">${category.icon}</div>
                    <div class="category-name">${category.name}</div>
                `;
                
                container.appendChild(card);
            });
        }

        // Navigation functions
        function exploreGroups() {
            console.log('Navigating to Groups Listing Page...');
            alert('Redirecting to Groups Listing Page...');
            // In production: window.location.href = '/groups/listing';
        }

        function viewGroupDetail(groupId) {
            console.log(`Navigating to group detail page for group ID: ${groupId}`);
            alert(`Opening Group Detail Page for group ${groupId}...`);
            // In production: window.location.href = `/groups/${groupId}`;
        }

        function filterByCategory(categoryName) {
            console.log(`Filtering groups by category: ${categoryName}`);
            alert(`Showing all ${categoryName} groups...`);
            // In production: window.location.href = `/groups?category=${categoryName}`;
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            generateGroupCards();
            generateCategoryCards();
        });

        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.15,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '0';
                    entry.target.style.transform = 'translateY(30px)';
                    
                    setTimeout(() => {
                        entry.target.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }, 100);
                    
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        // Observe sections
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.groups-grid, .categories-grid').forEach(section => {
                observer.observe(section);
            });
        });
    </script>
</body>
</html>
