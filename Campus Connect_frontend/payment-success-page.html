<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Campus Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f0f4f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(13, 27, 42, 0.15);
            padding: 60px 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Success Animation */
        .success-animation {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            position: relative;
        }

        .circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #10b981;
            position: relative;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .checkmark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 60px;
            height: 60px;
            animation: checkmarkScale 0.4s ease-out 0.5s forwards;
        }

        @keyframes checkmarkScale {
            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .checkmark::before {
            content: '';
            position: absolute;
            width: 4px;
            height: 30px;
            background: #10b981;
            left: 20px;
            top: 20px;
            transform: rotate(45deg);
            transform-origin: bottom;
            animation: checkmarkLine1 0.3s ease-out 0.9s forwards;
            opacity: 0;
        }

        .checkmark::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 15px;
            background: #10b981;
            left: 12px;
            top: 35px;
            transform: rotate(-45deg);
            transform-origin: bottom;
            animation: checkmarkLine2 0.2s ease-out 1.1s forwards;
            opacity: 0;
        }

        @keyframes checkmarkLine1 {
            to {
                opacity: 1;
            }
        }

        @keyframes checkmarkLine2 {
            to {
                opacity: 1;
            }
        }

        .success-confetti {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #1E90FF;
            animation: confettiFall 1.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(150px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Success Text */
        h1 {
            font-size: 32px;
            color: #0D1B2A;
            font-weight: 700;
            margin-bottom: 15px;
            animation: fadeIn 0.6s ease-out 0.3s both;
        }

        .success-message {
            font-size: 16px;
            color: #5a6c7d;
            margin-bottom: 40px;
            line-height: 1.6;
            animation: fadeIn 0.6s ease-out 0.5s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Divider */
        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #1E90FF, #0D1B2A);
            margin: 30px auto;
            border-radius: 2px;
        }

        /* Rating Section */
        .rating-section {
            margin: 40px 0;
            animation: fadeIn 0.6s ease-out 0.7s both;
        }

        .rating-title {
            font-size: 20px;
            color: #0D1B2A;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .stars-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .star {
            font-size: 48px;
            color: #d1d5db;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .star:hover,
        .star.hovered {
            color: #fbbf24;
            transform: scale(1.15);
        }

        .star.selected {
            color: #fbbf24;
        }

        .rating-value {
            font-size: 18px;
            color: #0D1B2A;
            font-weight: 600;
            min-height: 27px;
        }

        .rating-value.show {
            animation: scaleInText 0.3s ease-out;
        }

        @keyframes scaleInText {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Review Section */
        .review-section {
            margin: 30px 0;
            animation: fadeIn 0.6s ease-out 0.9s both;
        }

        .review-title {
            font-size: 18px;
            color: #0D1B2A;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: left;
        }

        .textarea-wrapper {
            position: relative;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            color: #0D1B2A;
            resize: vertical;
            transition: all 0.3s ease;
            outline: none;
        }

        textarea:focus {
            border-color: #1E90FF;
            box-shadow: 0 0 0 3px rgba(30, 144, 255, 0.1);
        }

        textarea::placeholder {
            color: #9ca3af;
        }

        .char-counter {
            text-align: right;
            font-size: 13px;
            color: #9ca3af;
            margin-top: 8px;
        }

        .char-counter.warning {
            color: #f59e0b;
        }

        .char-counter.limit {
            color: #ef4444;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            animation: fadeIn 0.6s ease-out 1.1s both;
        }

        .btn {
            flex: 1;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-family: 'Poppins', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0D1B2A 0%, #1a2f42 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(13, 27, 42, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(13, 27, 42, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: white;
            color: #0D1B2A;
            border: 2px solid #0D1B2A;
        }

        .btn-secondary:hover {
            background: #f9fafb;
            transform: translateY(-2px);
        }

        /* Thank You Message */
        .thank-you-message {
            display: none;
            text-align: center;
            animation: fadeInScale 0.5s ease-out;
        }

        .thank-you-message.show {
            display: block;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .thank-you-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .thank-you-title {
            font-size: 24px;
            color: #0D1B2A;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .thank-you-text {
            font-size: 16px;
            color: #5a6c7d;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .home-link {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #1E90FF 0%, #0D1B2A 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(30, 144, 255, 0.3);
        }

        .home-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 144, 255, 0.4);
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 26px;
            }

            .success-animation {
                width: 100px;
                height: 100px;
            }

            .circle {
                width: 100px;
                height: 100px;
            }

            .star {
                font-size: 40px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="mainContent">
            <!-- Success Animation -->
            <div class="success-animation">
                <div class="circle">
                    <div class="checkmark"></div>
                </div>
                <div class="success-confetti" id="confetti"></div>
            </div>

            <!-- Success Text -->
            <h1>Payment Successful!</h1>
            <p class="success-message">
                Your payment has been processed successfully. Thank you for your transaction!
            </p>

            <div class="divider"></div>

            <!-- Rating Section -->
            <div class="rating-section">
                <h2 class="rating-title">Rate Your Experience</h2>
                <div class="stars-container" id="starsContainer">
                    <span class="star" data-rating="1">★</span>
                    <span class="star" data-rating="2">★</span>
                    <span class="star" data-rating="3">★</span>
                    <span class="star" data-rating="4">★</span>
                    <span class="star" data-rating="5">★</span>
                </div>
                <div class="rating-value" id="ratingValue"></div>
            </div>

            <!-- Review Section -->
            <div class="review-section">
                <h3 class="review-title">Share Your Feedback</h3>
                <div class="textarea-wrapper">
                    <textarea 
                        id="reviewText" 
                        placeholder="Tell us about your experience..."
                        maxlength="500"
                    ></textarea>
                    <div class="char-counter" id="charCounter">0 / 500</div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button class="btn btn-secondary" id="skipBtn">Skip Review</button>
                <button class="btn btn-primary" id="submitBtn" disabled>Submit Review</button>
            </div>
        </div>

        <!-- Thank You Message (Hidden Initially) -->
        <div class="thank-you-message" id="thankYouMessage">
            <div class="thank-you-icon">🎉</div>
            <h2 class="thank-you-title">Thank You!</h2>
            <p class="thank-you-text">
                Your feedback helps us improve our services and provide better experiences for everyone.
            </p>
            <a href="/" class="home-link">Back to Home</a>
        </div>
    </div>

    <script>
        // Rating System
        let selectedRating = 0;
        const stars = document.querySelectorAll('.star');
        const ratingValue = document.getElementById('ratingValue');
        const submitBtn = document.getElementById('submitBtn');
        const skipBtn = document.getElementById('skipBtn');
        const reviewText = document.getElementById('reviewText');
        const charCounter = document.getElementById('charCounter');
        const mainContent = document.getElementById('mainContent');
        const thankYouMessage = document.getElementById('thankYouMessage');

        // Generate confetti
        function generateConfetti() {
            const confettiContainer = document.getElementById('confetti');
            const colors = ['#1E90FF', '#0D1B2A', '#fbbf24', '#10b981'];
            
            for (let i = 0; i < 20; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.top = `${Math.random() * 20}%`;
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = `${Math.random() * 0.5}s`;
                confetti.style.animationDuration = `${1 + Math.random()}s`;
                confettiContainer.appendChild(confetti);
            }
        }

        // Star hover effect
        stars.forEach(star => {
            star.addEventListener('mouseenter', function() {
                const rating = parseInt(this.dataset.rating);
                highlightStars(rating);
            });

            star.addEventListener('click', function() {
                selectedRating = parseInt(this.dataset.rating);
                selectStars(selectedRating);
                updateRatingValue();
                updateSubmitButton();
            });
        });

        // Container mouse leave - reset to selected
        document.getElementById('starsContainer').addEventListener('mouseleave', function() {
            if (selectedRating > 0) {
                selectStars(selectedRating);
            } else {
                clearStars();
            }
        });

        function highlightStars(rating) {
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('hovered');
                } else {
                    star.classList.remove('hovered');
                }
            });
        }

        function selectStars(rating) {
            stars.forEach((star, index) => {
                star.classList.remove('hovered');
                if (index < rating) {
                    star.classList.add('selected');
                } else {
                    star.classList.remove('selected');
                }
            });
        }

        function clearStars() {
            stars.forEach(star => {
                star.classList.remove('hovered', 'selected');
            });
        }

        function updateRatingValue() {
            if (selectedRating > 0) {
                const labels = ['', 'Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];
                ratingValue.textContent = `${selectedRating} / 5 - ${labels[selectedRating]}`;
                ratingValue.classList.add('show');
                setTimeout(() => ratingValue.classList.remove('show'), 300);
            } else {
                ratingValue.textContent = '';
            }
        }

        // Character counter
        reviewText.addEventListener('input', function() {
            const length = this.value.length;
            const maxLength = 500;
            charCounter.textContent = `${length} / ${maxLength}`;
            
            charCounter.classList.remove('warning', 'limit');
            if (length > 450) {
                charCounter.classList.add('warning');
            }
            if (length >= maxLength) {
                charCounter.classList.add('limit');
            }
            
            updateSubmitButton();
        });

        // Update submit button state
        function updateSubmitButton() {
            if (selectedRating > 0) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        // Submit review
        submitBtn.addEventListener('click', function() {
            const review = {
                rating: selectedRating,
                text: reviewText.value.trim(),
                timestamp: new Date().toISOString()
            };

            console.log('Submitting review:', review);
            
            // Here you would typically send the data to your backend
            // Example:
            // fetch('/api/submit-review', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify(review)
            // }).then(response => response.json())
            //   .then(data => showThankYou());

            // For now, just show the thank you message
            showThankYou();
        });

        // Skip review
        skipBtn.addEventListener('click', function() {
            if (confirm('Are you sure you want to skip the review?')) {
                window.location.href = '/';
            }
        });

        // Show thank you message
        function showThankYou() {
            mainContent.style.display = 'none';
            thankYouMessage.classList.add('show');
        }

        // Initialize confetti on page load
        window.addEventListener('load', function() {
            setTimeout(generateConfetti, 800);
        });
    </script>
</body>
</html>
