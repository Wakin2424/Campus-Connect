<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Chat - Campus Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f7fa;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: white;
            padding: 1rem 2rem;
            box-shadow: 0 2px 4px rgba(13, 27, 42, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0D1B2A;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #0D1B2A;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #1E90FF;
        }

        /* Group Info Bar */
        .group-info-bar {
            background: white;
            padding: 1rem 1.5rem;
            box-shadow: 0 2px 4px rgba(13, 27, 42, 0.1);
            position: sticky;
            top: 64px;
            z-index: 999;
            margin-top: 64px;
            transition: all 0.3s ease;
        }

        .group-info-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .group-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .group-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1E90FF, #0D1B2A);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .group-details h2 {
            font-size: 1.1rem;
            color: #0D1B2A;
            margin-bottom: 0.2rem;
        }

        .group-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: #666;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: #f5f7fa;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #10b981;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 0.9rem;
            font-weight: 500;
            color: #0D1B2A;
        }

        /* Chat Container */
        .chat-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
            padding-bottom: 120px;
            min-height: calc(100vh - 200px);
        }

        /* Message */
        .message {
            display: flex;
            margin-bottom: 1rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            flex-shrink: 0;
            margin: 0 0.75rem;
        }

        .message:not(.own) .message-avatar {
            background: white;
            color: #0D1B2A;
            box-shadow: 0 2px 4px rgba(13, 27, 42, 0.1);
        }

        .message.own .message-avatar {
            background: #1E90FF;
            color: white;
        }

        .message-content {
            max-width: 60%;
            display: flex;
            flex-direction: column;
        }

        .message-header {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            padding: 0 0.5rem;
        }

        .message:not(.own) .message-header {
            color: #0D1B2A;
        }

        .message.own .message-header {
            color: #1E90FF;
            text-align: right;
        }

        .message-bubble {
            padding: 0.75rem 1rem;
            border-radius: 18px;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .message:not(.own) .message-bubble {
            background: white;
            border-bottom-left-radius: 4px;
            color: #0D1B2A;
        }

        .message.own .message-bubble {
            background: #1E90FF;
            border-bottom-right-radius: 4px;
            color: white;
        }

        .message-time {
            font-size: 0.7rem;
            margin-top: 0.3rem;
            padding: 0 0.5rem;
            opacity: 0.7;
        }

        .message:not(.own) .message-time {
            color: #666;
        }

        .message.own .message-time {
            color: #0D1B2A;
            text-align: right;
        }

        /* System Message */
        .system-message {
            text-align: center;
            color: #999;
            font-size: 0.85rem;
            margin: 1.5rem 0;
            font-style: italic;
        }

        /* Input Area */
        .input-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 1rem;
            box-shadow: 0 -2px 10px rgba(13, 27, 42, 0.1);
            z-index: 998;
        }

        .input-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 0.75rem;
        }

        #messageInput {
            flex: 1;
            padding: 0.875rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 24px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            outline: none;
            resize: none;
            min-height: 48px;
            max-height: 150px;
            overflow-y: auto;
            transition: border-color 0.3s;
        }

        #messageInput:focus {
            border-color: #1E90FF;
        }

        #sendButton {
            width: 48px;
            height: 48px;
            background: #1E90FF;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        #sendButton:hover:not(:disabled) {
            background: #0D1B2A;
            transform: scale(1.05);
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Send Icon */
        .send-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 0.75rem 1rem;
            }

            .logo {
                font-size: 1.2rem;
            }

            .nav-links {
                gap: 1rem;
                font-size: 0.9rem;
            }

            .group-info-bar {
                padding: 0.75rem 1rem;
                top: 58px;
                margin-top: 58px;
            }

            .group-avatar {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .group-details h2 {
                font-size: 1rem;
            }

            .group-meta {
                font-size: 0.75rem;
            }

            .chat-container {
                padding: 1rem;
            }

            .message-content {
                max-width: 75%;
            }

            .message-avatar {
                width: 32px;
                height: 32px;
                font-size: 0.8rem;
            }

            .input-container {
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="#" class="logo">Campus Connect</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Groups</a></li>
                    <li><a href="#">Events</a></li>
                    <li><a href="#">Profile</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Group Info Bar -->
    <div class="group-info-bar">
        <div class="group-info-content">
            <div class="group-left">
                <div class="group-avatar">CS</div>
                <div class="group-details">
                    <h2>Computer Science 2024</h2>
                    <div class="group-meta">
                        <span><strong>Admin:</strong> John Doe</span>
                        <span><strong>Members:</strong> 42</span>
                    </div>
                </div>
            </div>
            <div class="connection-status">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusText">Connecting...</span>
            </div>
        </div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-container" id="chatContainer">
        <!-- Messages will be inserted here -->
    </div>

    <!-- Input Area -->
    <div class="input-container">
        <div class="input-wrapper">
            <textarea 
                id="messageInput" 
                placeholder="Type a message..." 
                rows="1"
                disabled
            ></textarea>
            <button id="sendButton" disabled>
                <svg class="send-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let chatSocket;
        let currentUser = 'You'; // Will be set from Django context

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        // WebSocket Connection
        function connectWebSocket() {
            chatSocket = new WebSocket("ws://" + window.location.host + "/ws/chat/room1/");

            chatSocket.onopen = function(e) {
                console.log('WebSocket connection established');
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
                messageInput.disabled = false;
                sendButton.disabled = false;
                addSystemMessage('Connected to chat room');
            };

            chatSocket.onmessage = function(e) {
                const data = JSON.parse(e.data);
                addMessage(data.username, data.message, data.timestamp, false);
            };

            chatSocket.onclose = function(e) {
                console.log('WebSocket connection closed');
                statusDot.classList.remove('connected');
                statusText.textContent = 'Disconnected';
                messageInput.disabled = true;
                sendButton.disabled = true;
                addSystemMessage('Disconnected from chat room');
                
                // Attempt to reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };

            chatSocket.onerror = function(e) {
                console.error('WebSocket error:', e);
                addSystemMessage('Connection error occurred');
            };
        }

        // Add Message
        function addMessage(username, message, timestamp, isOwn) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            
            if (isOwn || username === currentUser) {
                messageDiv.classList.add('own');
            }

            const time = timestamp ? new Date(timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const initials = username.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            const displayName = isOwn || username === currentUser ? 'You' : username;

            messageDiv.innerHTML = `
                <div class="message-avatar">${initials}</div>
                <div class="message-content">
                    <div class="message-header">${displayName}</div>
                    <div class="message-bubble">${escapeHtml(message)}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;

            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add System Message
        function addSystemMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'system-message';
            messageDiv.textContent = message;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Scroll to Bottom
        function scrollToBottom() {
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        }

        // Send Message
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message && chatSocket.readyState === WebSocket.OPEN) {
                chatSocket.send(JSON.stringify({
                    'message': message
                }));
                
                // Show message immediately for current user
                addMessage(currentUser, message, new Date().toISOString(), true);
                
                messageInput.value = '';
                messageInput.style.height = 'auto';
                messageInput.focus();
            }
        }

        // Event Listeners
        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Initialize
        connectWebSocket();

        // Add some demo messages for testing (remove in production)
        setTimeout(() => {
            addMessage('Alice Johnson', 'Hey everyone! Welcome to the group chat!', new Date().toISOString(), false);
        }, 1000);
        
        setTimeout(() => {
            addMessage('Bob Smith', 'Thanks Alice! Excited to be here.', new Date().toISOString(), false);
        }, 2000);
    </script>
</body>
</html>
