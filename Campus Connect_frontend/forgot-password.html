<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Campus Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>
    <!-- Header -->
    <header class="header" id="header">
        <!--Generated dynamically by js-->

    <!-- Main Content -->
    <main>
        <div class="forgot-password-card">
            <div class="card-header">
                <h1>Forgot Password?</h1>
                <p>No worries! Enter your email address and we'll send you a link to reset your password.</p>
            </div>

            <div id="messageContainer" class="message"></div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your registered email" 
                        required
                    >
                    <div class="helper-text">
                        We'll send you a password reset link if the email is registered.
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Send Reset Link
                </button>
            </form>

            <div class="back-to-login">
                <a href="#">← Back to Login</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <!--Generated dynamically by js-->
    </footer>

    <script>
        const home = `<a href="#" class="logo">Campus Connect</a>`
        const search = `
            <a href=''><button class="search-btn">🔍</button></a>
            `
        const nav_urls = `

                    <li><a href="market.html">Sell Books</a></li>
                    <li><a href="notes.html">Notes</a></li>
                    <li><a href="group.html">Groups</a></li>
                    `
        const login = `
                <a href="login.html" class="btn-primary">Login/Sign Up</a>
            `
        const logout = `
            <div class="user-dropdown">
                <div class="user-avatar">JS</div>
                <div class="dropdown-menu">
                    <a href="#"><i class="fas fa-user"></i> Profile</a>
                    <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        `
        const footer_urls = `
                    <a href="#">About Us</a>
                    <a href="#">Contact</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Service</a>
                    <a href="#">Help Center</a>`
        const footer_urls_2 = `
                    <a href="qa.html">Ask Questions</a>
                    <a href="market.html">Sell Books</a>
                    <a href="notes.html">Share Notes</a>
                    <a href="group.html">Create Groups</a>
                    <a href="home">Campus Events</a>`
    </script>
    <script src="css/index.js"></script>

    <script>
        const form = document.getElementById('forgotPasswordForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const messageContainer = document.getElementById('messageContainer');

        // Email validation function
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Show message function
        function showMessage(text, type) {
            messageContainer.textContent = text;
            messageContainer.className = `message ${type} show`;
            
            // Auto-hide error messages after 5 seconds
            if (type === 'error') {
                setTimeout(() => {
                    messageContainer.classList.remove('show');
                }, 5000);
            }
        }

        // Form submission handler
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            
            // Validate email
            if (!isValidEmail(email)) {
                showMessage('Please enter a valid email address.', 'error');
                return;
            }

            // Disable button and show processing state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            // Simulate API call (replace with actual API call)
            setTimeout(() => {
                // Simulate random success/error for demo
                const isSuccess = Math.random() > 0.3; // 70% success rate for demo
                
                if (isSuccess) {
                    showMessage('Password reset link sent. Check your email.', 'success');
                    emailInput.value = '';
                } else {
                    showMessage('Email address not found. Please check and try again.', 'error');
                }

                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }, 1500);
        });

        // Real-time email validation feedback
        emailInput.addEventListener('blur', function() {
            const email = emailInput.value.trim();
            if (email && !isValidEmail(email)) {
                emailInput.style.borderColor = '#dc3545';
            } else {
                emailInput.style.borderColor = '#e0e0e0';
            }
        });

        emailInput.addEventListener('input', function() {
            if (messageContainer.classList.contains('show')) {
                messageContainer.classList.remove('show');
            }
        });
    </script>
</body>
</html>
