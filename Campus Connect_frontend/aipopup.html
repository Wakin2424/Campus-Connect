<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Answer Frame Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f8f9fa;
    }

    .btn {
      padding: 10px 20px;
      background: #0D1B2A;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn:hover {
      background: #1E90FF;
    }

    /* AI Frame Styling */
    .ai-frame {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 350px;
      height: 300px;
      background: #fff;
      border: 2px solid #0D1B2A;
      box-shadow: -2px -2px 10px rgba(0,0,0,0.2);
      border-top-left-radius: 10px;
      display: none; /* hidden by default */
      flex-direction: column;
      z-index: 1000;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .ai-frame-header {
      background: #0D1B2A;
      color: #fff;
      padding: 10px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top-left-radius: 8px;
    }

    .ai-frame-content {
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
      color: #333;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Question Details Page</h2>
  <p>This is a placeholder page with some question details...</p>

  <!-- AI Button -->
  <button class="btn" onclick="openAIFrame()">Ask Codin AI</button>

  <!-- AI Frame -->
  <div class="ai-frame" id="aiFrame">
    <div class="ai-frame-header">
      Codin AI Answer
      <button class="close-btn" onclick="closeAIFrame()">×</button>
    </div>
    <div class="ai-frame-content" id="aiContent">
      Processing answer from backend...
    </div>
  </div>

  <script>
    function openAIFrame() {
      const frame = document.getElementById("aiFrame");
      const content = document.getElementById("aiContent");
      frame.style.display = "flex";

      // simulate backend processing
      content.textContent = "Processing answer from backend...";
      setTimeout(() => {
        content.textContent = "Here is Codin AI's generated answer based on the question provided. This can be dynamically replaced with backend response.";
      }, 2000);
    }

    function closeAIFrame() {
      document.getElementById("aiFrame").style.display = "none";
    }
  </script>
</body>
</html>
