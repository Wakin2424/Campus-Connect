    <script src="css/index.js"></script>

            },
            {
                id: 7,
                name: "Oxford English Dictionary",
                category: "reference",
                description: "Comprehensive reference for English language with etymology and usage examples.",
                price: 89.99,

            },
            {

            },
            {
                id: 9,
                name: "Biology: The Core",
                category: "textbook",
                description: "Modern biology textbook covering cellular processes, genetics, and evolution.",
                price: 62.00,
                image: "https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=400&h=300&fit=crop"
            },
            {
                id: 10,
                name: "To Kill a Mockingbird",
                category: "novel",
                description: "Timeless story about racial injustice and moral growth in the American South.",
                price: 13.75,
                image: "https://images.unsplash.com/photo-1519682337058-a94d519337bc?w=400&h=300&fit=crop"
            },
            {
                id: 11,
                name: "Psychology Research Methods",
                category: "textbook",
                description: "Guide to research methodology in psychology with statistical analysis techniques.",
                price: 58.00,
                image: "https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=400&h=300&fit=crop"
            },
            {
                id: 12,
                name: "Time Magazine",
                category: "magazine",
                description: "Weekly news magazine covering politics, business, and world events.",
                price: 6.50,
                image: "https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=400&h=300&fit=crop"
            }
        ];

        let currentPage = 1;
        const itemsPerPage = 6;
        let filteredProducts = [...allProducts];
        let isLoading = false;

        function showLoading() {
            isLoading = true;
            const container = document.getElementById('productsContainer');
            container.innerHTML = `
                <div class="loading-container" style="grid-column: 1 / -1;">
                    <div class="spinner"></div>
                    <div class="loading-text">Loading products...</div>
                </div>
            `;
        }

        function showEmptyState() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = `
                <div class="empty-state" style="grid-column: 1 / -1;">
                    <div class="empty-icon">📚</div>
                    <div class="empty-message">Nothing found</div>
                </div>
            `;
        }

        function filterAndSortProducts() {
            const priceSort = document.getElementById('sortPrice').value;
            const categoryFilter = document.getElementById('sortCategory').value;

            // Filter by category
            filteredProducts = categoryFilter
                ? allProducts.filter(p => p.category === categoryFilter)
                : [...allProducts];

            // Sort by price
            if (priceSort === 'low') {
                filteredProducts.sort((a, b) => a.price - b.price);
            } else if (priceSort === 'high') {
                filteredProducts.sort((a, b) => b.price - a.price);
            }

            currentPage = 1;
            displayProducts();
        }

        function displayProducts() {
            showLoading();

            // Simulate loading delay
            setTimeout(() => {
                isLoading = false;
                const container = document.getElementById('productsContainer');

                if (filteredProducts.length === 0) {
                    showEmptyState();
                    document.getElementById('pagination').innerHTML = '';
                    return;
                }

                const startIndex = (currentPage - 1) * itemsPerPage;
                const endIndex = startIndex + itemsPerPage;
                const pageProducts = filteredProducts.slice(startIndex, endIndex);

                container.innerHTML = pageProducts.map(product => `
                    <div class="product-card" onclick="viewProduct(${product.id})">
                        <img src="${product.image}" alt="${product.name}" class="product-image">
                        <div class="product-info">
                            <div class="product-category">${product.category}</div>
                            <div class="product-name">${product.name}</div>
                            <div class="product-description">${product.description}</div>
                            <div class="product-price">$${product.price.toFixed(2)}</div>
                        </div>
                    </div>
                `).join('');

                renderPagination();
            }, 500);
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
            const paginationContainer = document.getElementById('pagination');

            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let paginationHTML = '';

            // Previous button
            paginationHTML += `
                <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    ‹ Prev
                </button>
            `;

            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                paginationHTML += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }

            // Next button
            paginationHTML += `
                <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    Next ›
                </button>
            `;

            paginationContainer.innerHTML = paginationHTML;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
            if (page < 1 || page > totalPages || isLoading) return;

            currentPage = page;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            displayProducts();
        }

        function viewProduct(id) {
            alert(`Viewing product ${id}. In a real application, this would navigate to the product detail page.`);
        }

        // Event listeners
        document.getElementById('sortPrice').addEventListener('change', filterAndSortProducts);
        document.getElementById('sortCategory').addEventListener('change', filterAndSortProducts);

        // Initial display
        displayProducts();
    </script>
</body>
