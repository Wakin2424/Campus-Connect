    <script src="css/index.js"></script>

    <script>
        // Rating System
        let selectedRating = 0;
        const stars = document.querySelectorAll('.star');
        const ratingValue = document.getElementById('ratingValue');
        const submitBtn = document.getElementById('submitBtn');
        const skipBtn = document.getElementById('skipBtn');
        const reviewText = document.getElementById('reviewText');
        const charCounter = document.getElementById('charCounter');
        const mainContent = document.getElementById('mainContent');
        const thankYouMessage = document.getElementById('thankYouMessage');

        // Generate confetti
        function generateConfetti() {
            const confettiContainer = document.getElementById('confetti');
            const colors = ['#1E90FF', '#0D1B2A', '#fbbf24', '#10b981'];
            
            for (let i = 0; i < 20; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.top = `${Math.random() * 20}%`;
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = `${Math.random() * 0.5}s`;
                confetti.style.animationDuration = `${1 + Math.random()}s`;
                confettiContainer.appendChild(confetti);
            }
        }

        // Star hover effect
        stars.forEach(star => {
            star.addEventListener('mouseenter', function() {
                const rating = parseInt(this.dataset.rating);
                highlightStars(rating);
            });

            star.addEventListener('click', function() {
                selectedRating = parseInt(this.dataset.rating);
                selectStars(selectedRating);
                updateRatingValue();
                updateSubmitButton();
            });
        });

        // Container mouse leave - reset to selected
        document.getElementById('starsContainer').addEventListener('mouseleave', function() {
            if (selectedRating > 0) {
                selectStars(selectedRating);
            } else {
                clearStars();
            }
        });

        function highlightStars(rating) {
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('hovered');
                } else {
                    star.classList.remove('hovered');
                }
            });
        }

        function selectStars(rating) {
            stars.forEach((star, index) => {
                star.classList.remove('hovered');
                if (index < rating) {
                    star.classList.add('selected');
                } else {
                    star.classList.remove('selected');
                }
            });
        }

        function clearStars() {
            stars.forEach(star => {
                star.classList.remove('hovered', 'selected');
            });
        }

        function updateRatingValue() {
            if (selectedRating > 0) {
                const labels = ['', 'Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];
                ratingValue.textContent = `${selectedRating} / 5 - ${labels[selectedRating]}`;
                ratingValue.classList.add('show');
                setTimeout(() => ratingValue.classList.remove('show'), 300);
            } else {
                ratingValue.textContent = '';
            }
        }

        // Character counter
        reviewText.addEventListener('input', function() {
            const length = this.value.length;
            const maxLength = 500;
            charCounter.textContent = `${length} / ${maxLength}`;
            
            charCounter.classList.remove('warning', 'limit');
            if (length > 450) {
                charCounter.classList.add('warning');
            }
            if (length >= maxLength) {
                charCounter.classList.add('limit');
            }
            
            updateSubmitButton();
        });

        // Update submit button state
        function updateSubmitButton() {
            if (selectedRating > 0) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        // Submit review
        submitBtn.addEventListener('click', function() {
            const review = {
                rating: selectedRating,
                text: reviewText.value.trim(),
                timestamp: new Date().toISOString()
            };

            console.log('Submitting review:', review);
            
            // Here you would typically send the data to your backend
            // Example:
            // fetch('/api/submit-review', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify(review)
            // }).then(response => response.json())
            //   .then(data => showThankYou());

            // For now, just show the thank you message
            showThankYou();
        });

        // Skip review
        skipBtn.addEventListener('click', function() {
            if (confirm('Are you sure you want to skip the review?')) {
                window.location.href = '/';
            }
        });

        // Show thank you message
        function showThankYou() {
            mainContent.style.display = 'none';
            thankYouMessage.classList.add('show');
        }

        // Initialize confetti on page load
        window.addEventListener('load', function() {
            setTimeout(generateConfetti, 800);
        });
    </script>
</body>
