<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Product - Campus Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/product_upload.css">
    <link rel="stylesheet" href="css/nav.css">
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <!--Generated dynamically by js-->
    </header>

    <!-- Main Content -->
    <div class="main-content">
        <div class="page-header">
            <h1>Upload a Product</h1>
            <p>Provide details about your product to sell it on Campus Connect</p>
        </div>

        <div class="form-card">
            <form id="productForm">
                <!-- Image Upload -->
                <div class="form-group">
                    <label>📸 Product Image *</label>
                    <div class="image-upload-container" id="imageUploadContainer">
                        <input type="file" id="imageInput" accept="image/*" required>
                        <div class="upload-placeholder">
                            <div class="upload-icon">📷</div>
                            <p>Click to upload product image</p>
                        </div>
                        <img id="imagePreview" class="image-preview" alt="Product preview">
                    </div>
                </div>

                <!-- Product Name -->
                <div class="form-group">
                    <label for="productName">🏷 Product Name *</label>
                    <input type="text" id="productName" placeholder="Enter product name" required>
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label for="category">🗂 Product Category *</label>
                    <select id="category" required>
                        <option value="">Select a category</option>
                        <option value="books">Books</option>
                        <option value="handouts">Handouts</option>
                        <option value="past-papers">Past Papers</option>
                        <option value="notes">Notes</option>
                        <option value="guides">Guides</option>
                        <option value="stationery">Stationery</option>
                        <option value="electronics">Electronics</option>
                        <option value="others">Others</option>
                    </select>
                </div>

                <!-- Course Related -->
                <div class="form-group">
                    <label for="courseSelect">🎓 Course Related (Optional)</label>
                    <select id="courseSelect" class="course-selector">
                        <option value="">Select courses (optional)</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Business">Business</option>
                        <option value="Literature">Literature</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Biology">Biology</option>
                        <option value="Economics">Economics</option>
                        <option value="Others">Others</option>
                    </select>
                    <div class="course-tags" id="courseTags"></div>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="description">📝 Product Description *</label>
                    <div class="text-toolbar">
                        <button type="button" onclick="formatText('bold')"><b>B</b></button>
                        <button type="button" onclick="formatText('italic')"><i>I</i></button>
                        <button type="button" onclick="formatText('bullet')">• List</button>
                    </div>
                    <textarea id="description" placeholder="Describe your product..." required></textarea>
                </div>

                <!-- Price -->
                <div class="form-group">
                    <label for="price">💵 Price (KSh) *</label>
                    <input type="number" id="price" placeholder="Enter price" min="0" step="0.01" required>
                </div>

                <!-- Discount -->
                <div class="form-group">
                    <label for="discount">🔖 Discount (%) *</label>
                    <input type="number" id="discount" placeholder="Enter discount (0 if none)" value="0" min="0" max="100" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Upload Product</button>
            </form>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <h2>✅ Product Uploaded Successfully!</h2>
            <p>Your product has been listed on Campus Connect Marketplace.</p>
            <button class="modal-btn" onclick="closeModal()">Continue</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <!--Generated dynamically by js-->
    </footer>

    <script>
        const home = `<a href="#" class="logo">Campus Connect</a>`
        const search = `
            <a href=''><button class="search-btn">🔍</button></a>
            `
        const nav_urls = `
                    <li><a href="qa.html">Ask Questions</a></li>
                    <li><a href="market.html">Sell Books</a></li>
                    <li><a href="notes.html">Notes</a></li>
                    <li><a href="group.html">Groups</a></li>
                    `
        const login = `
                <a href="login.html" class="btn-primary">Login/Sign Up</a>
            `

        const footer_urls = `
                    <a href="#">About Us</a>
                    <a href="#">Contact</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Service</a>
                    <a href="#">Help Center</a>`
        const footer_urls_2 = `
                    <a href="qa.html">Ask Questions</a>
                    <a href="market.html">Sell Books</a>
                    <a href="notes.html">Share Notes</a>
                    <a href="group.html">Create Groups</a>
                    <a href="home">Campus Events</a>`
    </script>
    <script src="css/index.js"></script>

    <script>
        // Selected courses array
        let selectedCourses = [];

        // Image Upload Preview
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const imageUploadContainer = document.getElementById('imageUploadContainer');

        imageUploadContainer.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    imagePreview.classList.add('show');
                    imageUploadContainer.classList.add('has-image');
                    imageUploadContainer.querySelector('.upload-placeholder').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        // Course Selection
        const courseSelect = document.getElementById('courseSelect');
        const courseTags = document.getElementById('courseTags');

        courseSelect.addEventListener('change', (e) => {
            const course = e.target.value;
            if (course && !selectedCourses.includes(course)) {
                selectedCourses.push(course);
                renderCourseTags();
                e.target.value = '';
            }
        });

        function renderCourseTags() {
            courseTags.innerHTML = '';
            selectedCourses.forEach((course, index) => {
                const tag = document.createElement('div');
                tag.className = 'course-tag';
                tag.innerHTML = `
                    ${course}
                    <span class="remove" onclick="removeCourse(${index})">×</span>
                `;
                courseTags.appendChild(tag);
            });
        }

        function removeCourse(index) {
            selectedCourses.splice(index, 1);
            renderCourseTags();
        }

        // Text Formatting
        function formatText(type) {
            const textarea = document.getElementById('description');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);
            let formattedText = '';

            if (type === 'bold') {
                formattedText = `**${selectedText}**`;
            } else if (type === 'italic') {
                formattedText = `*${selectedText}*`;
            } else if (type === 'bullet') {
                formattedText = `• ${selectedText}`;
            }

            textarea.value = textarea.value.substring(0, start) + formattedText + textarea.value.substring(end);
            textarea.focus();
        }

        // Form Submission
        const productForm = document.getElementById('productForm');
        const successModal = document.getElementById('successModal');

        productForm.addEventListener('submit', (e) => {
            e.preventDefault();

            // Validate required fields
            if (!imageInput.files[0]) {
                alert('Please upload a product image');
                return;
            }

            const productData = {
                name: document.getElementById('productName').value,
                category: document.getElementById('category').value,
                courses: selectedCourses,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value),
                discount: parseInt(document.getElementById('discount').value) || 0,
                image: imagePreview.src
            };

            console.log('Product Data:', productData);

            // Show success modal
            successModal.classList.add('show');

            // Reset form
            productForm.reset();
            imagePreview.classList.remove('show');
            imageUploadContainer.classList.remove('has-image');
            imageUploadContainer.querySelector('.upload-placeholder').style.display = 'block';
            selectedCourses = [];
            renderCourseTags();
        });

        function closeModal() {
            successModal.classList.remove('show');
        }
    </script>
</body>
</html>
