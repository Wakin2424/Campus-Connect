<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Campus Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/payment.css">
    <link rel="stylesheet" href="css/nav.css">
</head>
<body>
    <header id="header">
        
    </header>

    <div class="container">
        <!-- Left Column -->
        <div>
            <!-- Product Summary -->
            <div class="card">
                <h2>Product Summary</h2>
                <div class="product-summary">
                    <div class="product-image">📚</div>
                    <div class="product-details">
                        <h3>Engineering Mathematics Textbook</h3>
                        <div class="product-price">KSh 2,500</div>
                    </div>
                </div>
            </div>

            <!-- Address Details -->
            <div class="card">
                <h2>Delivery Address</h2>
                <form id="addressForm">
                    <div class="form-group">
                        <label for="fullName">Full Name *</label>
                        <input type="text" id="fullName" name="fullName" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="address">Street Address *</label>
                        <input type="text" id="address" name="address" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City *</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        <div class="form-group">
                            <label for="postal">Postal Code *</label>
                            <input type="text" id="postal" name="postal" required>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Right Column -->
        <div>
            <!-- Payment Methods -->
            <div class="card">
                <h2>Choose Payment Method</h2>
                <div class="payment-methods">
                    <div class="payment-option" data-method="paypal">
                        <input type="radio" id="paypal" name="payment" value="paypal">
                        <label for="paypal">PayPal</label>
                        <div class="payment-logo">PP</div>
                    </div>
                    <div class="payment-details" id="paypal-details">
                        <button type="button" class="paypal-btn">Proceed with PayPal</button>
                    </div>

                    <div class="payment-option" data-method="mpesa">
                        <input type="radio" id="mpesa" name="payment" value="mpesa">
                        <label for="mpesa">M-Pesa</label>
                        <div class="payment-logo">MP</div>
                    </div>
                    <div class="payment-details" id="mpesa-details">
                        <div class="form-group">
                            <label for="mpesa-phone">M-Pesa Phone Number</label>
                            <input type="tel" id="mpesa-phone" placeholder="+254700000000">
                        </div>
                    </div>

                    <div class="payment-option" data-method="cod">
                        <input type="radio" id="cod" name="payment" value="cod">
                        <label for="cod">Pay on Delivery</label>
                        <div class="payment-logo">COD</div>
                    </div>
                    <div class="payment-details" id="cod-details">
                        <p style="color: #0D1B2A; font-weight: 500;">
                            📦 You will pay when your product is delivered.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Order Summary -->
            <div class="card">
                <h2>Order Summary</h2>
                <div class="order-summary">
                    <div class="summary-row">
                        <span>Product Price:</span>
                        <span>KSh 2,500</span>
                    </div>
                    <div class="summary-row">
                        <span>Delivery Fee:</span>
                        <span>KSh 200</span>
                    </div>
                    <div class="summary-row summary-total">
                        <span>Total Amount:</span>
                        <span>KSh 2,700</span>
                    </div>
                </div>
                <button type="button" class="confirm-btn" id="confirmBtn" disabled>
                    Confirm Payment
                </button>
            </div>
        </div>
    </div>
    <!-- Footer -->
    <footer class="footer" id="footer">
    </footer>

    <script>
        const nav_urls = `
                    <li><a href="home.html">Home</a></li>
                    <li><a href="qa.html">Ask Questions</a></li>
                    <li><a href="market.html">Sell Books</a></li>
                    <li><a href="notes.html">Notes</a></li>
                    <li><a href="group.html">Groups</a></li>
                    `
        const login = `
        <div class="search-container">
                <input type="text" class="search-bar" placeholder="Search...">
                <a href="login.html" class="btn-primary">Login</a>
            </div>`
        const logout = `
            <div class="user-dropdown">
                <div class="user-avatar">JS</div>
                <div class="dropdown-menu">
                    <a href="#"><i class="fas fa-user"></i> Profile</a>
                    <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        `


        const footer_urls = `
                    <a href="#">About Us</a>
                    <a href="#">Contact</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Service</a>
                    <a href="#">Help Center</a>`
        const footer_urls_2 = `
                    <a href="qa.html">Ask Questions</a>
                    <a href="market.html">Sell Books</a>
                    <a href="notes.html">Share Notes</a>
                    <a href="group.html">Create Groups</a>
                    <a href="home">Campus Events</a>`
    </script>
    <script src="css/index.js"></script>

    <script>
        // Payment method selection
        const paymentOptions = document.querySelectorAll('.payment-option');
        const paymentDetails = document.querySelectorAll('.payment-details');
        const confirmBtn = document.getElementById('confirmBtn');
        const addressForm = document.getElementById('addressForm');

        paymentOptions.forEach(option => {
            option.addEventListener('click', () => {
                const method = option.dataset.method;
                const radio = option.querySelector('input[type="radio"]');
                
                // Clear previous selections
                paymentOptions.forEach(opt => opt.classList.remove('selected'));
                paymentDetails.forEach(detail => detail.classList.remove('active'));
                
                // Select current option
                option.classList.add('selected');
                radio.checked = true;
                document.getElementById(`${method}-details`).classList.add('active');
                
                validateForm();
            });
        });

        // Form validation
        function validateForm() {
            const formInputs = addressForm.querySelectorAll('input[required]');
            const paymentSelected = document.querySelector('input[name="payment"]:checked');
            
            let allValid = true;
            
            formInputs.forEach(input => {
                if (!input.value.trim()) {
                    allValid = false;
                }
            });
            
            if (!paymentSelected) {
                allValid = false;
            }
            
            // Additional validation for M-Pesa
            if (paymentSelected && paymentSelected.value === 'mpesa') {
                const mpesaPhone = document.getElementById('mpesa-phone');
                if (!mpesaPhone.value.trim()) {
                    allValid = false;
                }
            }
            
            confirmBtn.disabled = !allValid;
        }

        // Add event listeners to form inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('input', validateForm);
        });

        // Confirm button click handler
        confirmBtn.addEventListener('click', () => {
            const selectedPayment = document.querySelector('input[name="payment"]:checked');
            if (selectedPayment) {
                alert(`Payment confirmed using ${selectedPayment.value.toUpperCase()}!`);
            }
        });

        // Initialize form validation
        validateForm();
    </script>
</body>
</html>
