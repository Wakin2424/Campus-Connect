<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>
    <!-- Header -->
    <header class="header" id="header">
        <!--Generated dynamically by js-->

    <div class="login-container">
        <div class="header">
            <div class="logo">Campus Connect</div>
            <h1 class="login-title">Login to Campus Connect</h1>
            <p class="login-subtitle">Welcome back! Please enter your details.</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <input 
                    type="email" 
                    class="form-input" 
                    placeholder="Enter your email"
                    required
                    id="email"
                >
            </div>

            <div class="form-group">
                <div class="password-container">
                    <input 
                        type="password" 
                        class="form-input" 
                        placeholder="Enter your password"
                        required
                        id="password"
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <span id="toggleText">Show</span>
                    </button>
                </div>
            </div>

            <div class="forgot-password">
                <a href="#forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Login
            </button>
        </form>

        <div class="divider">
            <span>or continue with</span>
        </div>

        <button class="google-btn" onclick="loginWithGoogle()">
            <svg class="google-icon" viewBox="0 0 24 24">

                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Login with Google
        </button>

        <div class="footer">
            <p>Don't have an account? <a href="#register">Register here</a></p>
        </div>
    </div>

    <footer class="footer" id="footer">

    <script src="css/index.js"></script>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleText = document.getElementById('toggleText');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleText.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleText.textContent = 'Show';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            
            const loginBtn = document.getElementById('loginBtn');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Add loading state
            loginBtn.classList.add('btn-loading');
            loginBtn.disabled = true;
            
            // Simulate login process
            setTimeout(() => {
                loginBtn.classList.remove('btn-loading');
                loginBtn.disabled = false;
                alert(`Login attempted for: ${email}`);
                // Here you would typically redirect or handle the login response
            }, 2000);
        }

        function loginWithGoogle() {
            alert('Google login would be implemented here');
            // Here you would integrate with Google OAuth
        }

        // Add input validation feedback
        document.getElementById('email').addEventListener('blur', function() {
            if (this.value && this.checkValidity()) {
                this.classList.add('success');
                this.classList.remove('error');
            } else if (this.value) {
                this.classList.add('error');
                this.classList.remove('success');
            }
        });

        document.getElementById('password').addEventListener('input', function() {
            if (this.value.length >= 6) {
                this.classList.add('success');
                this.classList.remove('error');
            } else if (this.value.length > 0) {
                this.classList.add('error');
                this.classList.remove('success');
            }
        });
    </script>
